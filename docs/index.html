<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent X – Live Dashboard V2</title>

<style>
:root{
  --bg1:#0a0f1c;
  --bg2:#0d1a33;
  --card:#111c2e;
  --card2:#1a2a44;
  --text:#ffffff;
  --muted:rgba(255,255,255,0.7);
  --ok:#1f7a3f;
  --start:#1f4d7a;
  --block:#7a1f1f;
  --bar:#2ecc71;
  --line:rgba(255,255,255,0.08);
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
}

header{
  padding:18px 20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
}

h1{
  margin:0;
  font-size:26px;
}

.small{
  margin:6px 0 0;
  color:var(--muted);
  font-size:12px;
}

.wrap{
  display:flex;
  gap:16px;
  padding:18px;
  flex-wrap:wrap;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:16px;
  min-width:300px;
  flex:1;
  box-shadow:0 0 18px rgba(0,0,0,0.35);
}

.card h2{
  margin:0 0 12px;
  font-size:16px;
}

.chip{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-weight:bold;
  margin:6px 8px 0 0;
  background:#333;
}

.ok{ background:var(--ok); }
.start{ background:var(--start); }
.block{ background:var(--block); }

.row{
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  margin-bottom:10px;
}

.row-title{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  font-weight:bold;
}

.row-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
  line-height:1.35;
}

.progressbar{
  height:10px;
  background:rgba(255,255,255,0.12);
  border-radius:6px;
  overflow:hidden;
  margin-top:8px;
}

.progressfill{
  height:100%;
  width:0%;
  background:var(--bar);
}

.kvline{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 10px;
  border-radius:10px;
  border:1px solid var(--line);
  background:rgba(255,255,255,0.02);
  margin-bottom:8px;
}

.debug{
  position:fixed;
  top:10px;
  right:10px;
  z-index:9999;
  background:#111;
  padding:6px 10px;
  font-size:12px;
  border-radius:6px;
  font-family:monospace;
}
</style>
</head>

<body>
<header>
  <div>
    <h1>Agent X – Live Dashboard (V2)</h1>
    <div class="small">Quelle: Google Sheets → Apps Script JSON → GitHub Pages</div>
  </div>
  <div class="small" id="updatedAt">updated: ...</div>
</header>

<div class="wrap">

  <div class="card">
    <h2>Systems</h2>
    <div id="systemsList">loading…</div>
  </div>

  <div class="card">
    <h2>Projects</h2>
    <div id="projectsList">loading…</div>
  </div>

  <div class="card">
    <h2>Finance (KV)</h2>
    <div class="small">Optional: kommt aus Tab <b>kv</b> (key/value). Wenn kv fehlt, bleibt dieser Block leer.</div>
    <div style="height:10px"></div>
    <div id="financeList">loading…</div>
  </div>

</div>

<div id="dataStatus" class="debug">loading…</div>

<script>
// ✅ HIER EINTRAGEN: deine WebApp URL (exec) + mode=v2
const API_URL = "https://script.google.com/macros/s/AKfycbxt2xbCqnzw5VOZ7IJfmVkbHsk-DksX4TwRiN4NPIwH/exec?mode=v2";

function setStatus(text, ok=true){
  const el = document.getElementById("dataStatus");
  el.textContent = text;
  el.style.color = ok ? "#0f0" : "#f33";
}

function statusClass(s){
  const v = String(s || "").toUpperCase();
  if(v === "OK") return "ok";
  if(v === "START") return "start";
  if(v === "BLOCK") return "block";
  return "";
}

function moneyDE(v){
  const n = Number(v);
  if(Number.isFinite(n)) return n.toLocaleString("de-DE") + " €";
  return String(v ?? "");
}

function safeText(v){
  return String(v ?? "");
}

function renderSystems(systems){
  const el = document.getElementById("systemsList");
  el.innerHTML = "";
  if(!Array.isArray(systems) || systems.length === 0){
    el.textContent = "No systems data";
    return;
  }

  systems.forEach(item=>{
    const system = safeText(item.system);
    const status = safeText(item.status);
    const prog = item.progress;
    const note = safeText(item.note);

    const row = document.createElement("div");
    row.className = "row";

    const top = document.createElement("div");
    top.className = "row-title";
    top.innerHTML = `<span>${system}</span><span class="chip ${statusClass(status)}">${status}</span>`;

    const sub = document.createElement("div");
    sub.className = "row-sub";
    sub.textContent = note;

    row.appendChild(top);
    row.appendChild(sub);

    if(prog !== null && prog !== undefined && prog !== ""){
      const p = Math.max(0, Math.min(100, Number(prog)));
      const bar = document.createElement("div");
      bar.className = "progressbar";
      const fill = document.createElement("div");
      fill.className = "progressfill";
      fill.style.width = (Number.isFinite(p) ? p : 0) + "%";
      bar.appendChild(fill);
      row.appendChild(bar);
    }

    el.appendChild(row);
  });
}

function renderProjects(projects){
  const el = document.getElementById("projectsList");
  el.innerHTML = "";
  if(!Array.isArray(projects) || projects.length === 0){
    el.textContent = "No projects data";
    return;
  }

  projects.forEach(p=>{
    const row = document.createElement("div");
    row.className = "row";

    const id = safeText(p.id);
    const name = safeText(p.name);
    const owner = safeText(p.owner);
    const status = safeText(p.status);
    const blocker = safeText(p.blocker);
    const deadline = safeText(p.deadline);
    const prog = p.progress;

    const top = document.createElement("div");
    top.className = "row-title";
    top.innerHTML = `<span>${id} • ${name}</span><span class="chip">${status || "—"}</span>`;

    const sub = document.createElement("div");
    sub.className = "row-sub";
    sub.innerHTML =
      `<div><b>Owner:</b> ${owner || "—"}</div>` +
      `<div><b>Deadline:</b> ${deadline ? deadline.slice(0,10) : "—"}</div>` +
      `<div><b>Blocker:</b> ${blocker || "—"}</div>`;

    row.appendChild(top);
    row.appendChild(sub);

    if(prog !== null && prog !== undefined && prog !== ""){
      const pr = Math.max(0, Math.min(100, Number(prog)));
      const bar = document.createElement("div");
      bar.className = "progressbar";
      const fill = document.createElement("div");
      fill.className = "progressfill";
      fill.style.width = (Number.isFinite(pr) ? pr : 0) + "%";
      bar.appendChild(fill);
      row.appendChild(bar);

      const ptxt = document.createElement("div");
      ptxt.className = "row-sub";
      ptxt.textContent = "Progress: " + (Number.isFinite(pr) ? pr : 0) + "%";
      row.appendChild(ptxt);
    }

    el.appendChild(row);
  });
}

function renderFinanceKV(kv){
  const el = document.getElementById("financeList");
  el.innerHTML = "";

  if(!kv || typeof kv !== "object" || Object.keys(kv).length === 0){
    el.textContent = "kv missing or empty (create tab 'kv')";
    return;
  }

  // Wir zeigen nur finance.* Keys
  const keys = Object.keys(kv).filter(k => String(k).startsWith("finance."));
  if(keys.length === 0){
    el.textContent = "No finance.* keys in kv";
    return;
  }

  keys.sort().forEach(k=>{
    const line = document.createElement("div");
    line.className = "kvline";
    const label = k.replace("finance.","");
    const val = kv[k];
    line.innerHTML = `<span>${label}</span><span><b>${moneyDE(val)}</b></span>`;
    el.appendChild(line);
  });
}

async function load(){
  try{
    setStatus("fetch…");
    const url = API_URL + "&_=" + Date.now();
    const res = await fetch(url, { cache: "no-store" });
    const json = await res.json();

    document.getElementById("updatedAt").textContent = "updated: " + (json.updated || "—");

    renderSystems(json.systems);
    renderProjects(json.projects);
    renderFinanceKV(json.kv);

    setStatus("OK • " + new Date().toLocaleTimeString(), true);

  }catch(e){
    console.error(e);
    setStatus("ERROR: " + e.message, false);
  }
}

load();

// Optional: Auto-Refresh (alle 30 Sekunden)
// setInterval(load, 30000);
</script>

</body>
</html>

loadData();

</script>
</body>
</html>
