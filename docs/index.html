<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent X – Live Dashboard V2</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0a0f1c,#0d1a33);
  color: white;
}

h1 { padding:20px; margin:0; }

.container {
  display:flex;
  gap:20px;
  padding:20px;
  flex-wrap:wrap;
}

.card {
  background:#111c2e;
  border-radius:12px;
  padding:20px;
  min-width:300px;
  flex:1;
}

.status {
  margin:6px 0;
  padding:6px 10px;
  border-radius:15px;
  display:inline-block;
  font-weight:bold;
}

.ok { background:#1f7a3f; }
.start { background:#1f4d7a; }
.block { background:#7a1f1f; }

.project {
  margin-bottom:12px;
  padding:10px;
  background:#1a2a44;
  border-radius:8px;
}

.progress-bar {
  height:10px;
  background:#333;
  border-radius:5px;
  overflow:hidden;
  margin-top:5px;
}

.progress-fill {
  height:100%;
  background:#2ecc71;
}

.debug {
  position:fixed;
  top:10px;
  right:10px;
  background:#111;
  padding:6px 10px;
  font-size:12px;
  border-radius:6px;
  font-family:monospace;
}
</style>
</head>
<body>

<h1>Agent X – Live Dashboard</h1>

<div class="container">

<div class="card">
<h2>Systems</h2>
<div id="systemsContainer"></div>
</div>

<div class="card">
<h2>Finance</h2>
<div id="financeContainer"></div>
</div>

<div class="card">
<h2>Projects</h2>
<div id="projectsContainer"></div>
</div>

</div>

<div id="dataStatus" class="debug">loading...</div>

<script>

const ENDPOINT = "https://script.google.com/macros/s/AKfycbwKWHhZPixif32U2b5AsfbS10OAYIxwvDD39GMWUHdqRqaktqxDr7KM0Dcbpu958V2wEQ/exec?sheet=dashboard";

function namespaceToObject(flat){
  const result = {};

  Object.keys(flat).forEach(key=>{
    const parts = key.split(".");
    let current = result;

    parts.forEach((part,index)=>{
      if(index === parts.length - 1){
        current[part] = flat[key];
      } else {
        current[part] = current[part] || {};
        current = current[part];
      }
    });
  });

  return result;
}

function renderSystems(data){
  const container = document.getElementById("systemsContainer");
  container.innerHTML = "";

  if(!data.systems) return;

  Object.keys(data.systems).forEach(name=>{
    const value = String(data.systems[name]).toUpperCase();
    const div = document.createElement("div");
    div.className = "status " +
      (value==="OK"?"ok":
       value==="START"?"start":
       value==="BLOCK"?"block":"");
    div.textContent = name + " : " + value;
    container.appendChild(div);
  });
}

function renderFinance(data){
  const container = document.getElementById("financeContainer");
  container.innerHTML = "";

  if(!data.finance) return;

  Object.keys(data.finance).forEach(key=>{
    const div = document.createElement("div");
    div.textContent =
      key + " : " +
      Number(data.finance[key]).toLocaleString("de-DE") + " €";
    container.appendChild(div);
  });
}

function renderProjects(data){
  const container = document.getElementById("projectsContainer");
  container.innerHTML = "";

  if(!data.project) return;

  Object.keys(data.project).forEach(id=>{
    const project = data.project[id];
    const wrapper = document.createElement("div");
    wrapper.className = "project";

    const title = document.createElement("div");
    title.textContent = "Project " + id;
    wrapper.appendChild(title);

    if(project.progress){
      const bar = document.createElement("div");
      bar.className="progress-bar";

      const fill = document.createElement("div");
      fill.className="progress-fill";
      fill.style.width = project.progress + "%";

      bar.appendChild(fill);
      wrapper.appendChild(bar);
    }

    Object.keys(project).forEach(field=>{
      if(field !== "progress"){
        const p = document.createElement("div");
        p.textContent = field + " : " + project[field];
        wrapper.appendChild(p);
      }
    });

    container.appendChild(wrapper);
  });
}

async function loadData(){
  try{
    document.getElementById("dataStatus").textContent="fetching...";
    const res = await fetch(ENDPOINT+"&v="+Date.now());
    const payload = await res.json();

    const flat = {};
    payload.data.forEach(item=>{
      flat[item.key] = item.value;
    });

    const structured = namespaceToObject(flat);

    renderSystems(structured);
    renderFinance(structured);
    renderProjects(structured);

    document.getElementById("dataStatus").textContent =
      "OK • "+new Date().toLocaleTimeString();

  }catch(e){
    document.getElementById("dataStatus").textContent =
      "ERROR "+e.message;
  }
}

loadData();

</script>
</body>
</html>
